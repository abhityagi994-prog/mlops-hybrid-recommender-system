stages:
  clean_data:
    cmd: python src/data/data_cleaning.py
    deps:
      - data/raw/songs/Music Info.csv
      - src/data/data_cleaning.py
    outs:
      - data/processed/cleaned_songs.csv

  transform_content:
    cmd: python src/features/content_based_filtering.py
    deps:
      - data/processed/cleaned_songs.csv
      - src/features/content_based_filtering.py
    outs:
      - data/processed/transformed_content_data.npz
      - models/content_transformer.joblib

  collaborative_filtering:
    cmd: python src/models/collaborative_filtering.py
    deps:
      - data/raw/songs/User Listening History.csv
      - data/processed/cleaned_songs.csv
      - src/models/collaborative_filtering.py
    outs:
      - data/processed/collab_filtered_songs.csv
      - data/processed/track_ids.npy
      - data/processed/interaction_matrix.npz